# gitleaks allowlist for agent-ready-poc
#
# Inheriting the default gitleaks ruleset (8.18.x).

[extend]
useDefault = true

[allowlist]
description = "Local-only secret store. .env is gitignored but kept on disk for host helpers like `make whoami`; --no-git scans would otherwise flag it."

paths = [
  '''^\.env$''',
]
